spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/guardianai
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view : false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 500ms #Every request should take less than 500 ms 
      connect-timeout: 500ms # to connect the app can wait for 500 ms 
  # autoconfigure:
  #   #TODO: remove this exclude block when Redis is introduced
  #   exclude:
  #     - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  #     - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration

managemnet:
  endpoint:
    health:
      show-details: always
  # health:
  #   redis:
  #     enabled: false

server:
  port: 8080


guardian:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 15
  rate-limit: 
    enabled: true
    login-per-minute: 5
    register-per-minute: 5
    scan-per-minute: 30
    default-per-minute: 120
  cache: 
    low-ttl-minutes: 60
    medium-ttl-minutes: 30
    high-ttl-minutes: 360

